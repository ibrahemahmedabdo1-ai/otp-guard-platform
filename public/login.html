<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — OTP Guard</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/"><div class="logo"><img src="/assets/img/logo.svg" alt="OTP Guard"></div></a>
    <select id="langSelect" class="lang-select">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
  </nav>

  <div class="auth-wrap">
    <h2 data-i18n="login_title">تسجيل الدخول</h2>
    <div class="error-box" id="errorBox"></div>
    <form id="loginForm">
      <div class="field">
        <label data-i18n="email">البريد الإلكتروني</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label data-i18n="password">كلمة المرور</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="submit">دخول</button>
    </form>
    <div class="auth-switch">
      ليس لديك حساب؟ <a href="/register.html" style="color:var(--primary);font-weight:600">أنشئ حساب جديد</a>
    </div>
    <div class="auth-switch" style="margin-top:6px;font-size:11px;color:#94A3B8;">
      حسابات تجريبية: admin@otpguard.com / Admin@12345 — support@otpguard.com / Support@12345
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorBox");
      errorBox.style.display = "none";
      try {
        const data = await apiFetch("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
        saveSession(data.token, data.user);
        redirectByRole(data.user.role);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
