<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأسعار — OTP Guard</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/"><div class="logo"><img src="/assets/img/logo.svg" alt="OTP Guard"></div></a>
    <div class="nav-links">
      <select id="langSelect" class="lang-select">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
      <a href="/login.html" class="btn btn-outline" data-i18n="nav_login">تسجيل الدخول</a>
      <a href="/register.html" class="btn btn-primary" data-i18n="nav_register">حساب جديد</a>
    </div>
  </nav>

  <div class="container" style="padding:50px 20px;">
    <h1 style="text-align:center;margin-bottom:6px;" data-i18n="pricing_title">الأسعار</h1>
    <p style="text-align:center;color:var(--muted);margin-bottom:36px;">سعر كل قناة منفصل تمامًا — ادفع فقط على ما تستخدمه</p>

    <div id="pricingGrid" class="features"></div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script>
    (async () => {
      const labels = { whatsapp: "📱 واتساب", sms: "💬 SMS", email: "✉️ إيميل", bundle: "📦 باكدج مجمع" };
      try {
        const pricing = await apiFetch("/pricing");
        const grid = document.getElementById("pricingGrid");
        grid.innerHTML = Object.entries(pricing).map(([channel, tiers]) => `
          <div class="feature-card">
            <h3>${labels[channel] || channel}</h3>
            <table style="margin-top:12px;">
              <thead><tr><th>عدد الرسائل</th><th>السعر (USD)</th></tr></thead>
              <tbody>
                ${tiers.map(t => `<tr><td>${t.qty}</td><td>$${t.price}</td></tr>`).join("")}
              </tbody>
            </table>
          </div>
        `).join("");
      } catch (e) {
        document.getElementById("pricingGrid").innerHTML = "<p style='color:var(--muted)'>تعذّر تحميل الأسعار حاليًا</p>";
      }
    })();
  </script>
</body>
</html>
